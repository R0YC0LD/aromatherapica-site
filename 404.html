<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sayfa bulunamadi | Aromatherapica</title>
    <meta name="robots" content="noindex">
    <!-- Bu sayfa herhangi bir derinlikteki adres icin sunulabildiginden
         goreli varlik yollari guvenilir degildir; bu yuzden tamamen
         kendi kendine yeterlidir (harici css/js/gorsel yok). -->
    <style>
        :root {
            --ink: #45474a;
            --muted: #6d7075;
            --line: #e3e3e1;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: #fff;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 520px;
            text-align: center;
        }

        .brand {
            font-size: .78rem;
            letter-spacing: .34em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 2.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .code {
            font-size: 4.5rem;
            line-height: 1;
            margin: 0 0 1rem;
            letter-spacing: .04em;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.3;
            margin: 0 0 .9rem;
        }

        p {
            color: var(--muted);
            line-height: 1.65;
            margin: 0 0 2rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: .95rem;
        }

        .btn {
            display: inline-block;
            background: var(--ink);
            color: #fff;
            text-decoration: none;
            padding: .85rem 2.4rem;
            border-radius: 2px;
            font-size: .72rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            transition: opacity .18s;
        }

        .btn:hover {
            opacity: .85;
        }

        .rule {
            border: 0;
            border-top: 1px solid var(--line);
            margin: 3rem auto 0;
            width: 60px;
        }

        @media (max-width:480px) {
            .code {
                font-size: 3.4rem;
            }

            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <p class="brand">Aromatherapica</p>
        <p class="code">404</p>
        <h1>Aradiginiz sayfayi bulamadik</h1>
        <p>Adres degismis ya da sayfa kaldirilmis olabilir.<br>Ana sayfadan devam edebilirsiniz.</p>
        <a class="btn" id="home" href="/">Ana sayfaya don</a>
        <hr class="rule">
    </div>
    <script>
        // Proje sitesi bir alt dizinde yayinlandigindan (ornegin
        // /aromatherapica-site/) ana sayfa baglantisini adrese gore kur.
        (function () {
            var seg = location.pathname.split('/').filter(Boolean);
            var base = (location.hostname.indexOf('github.io') > -1 && seg.length) ? '/' + seg[0] + '/' : '/';
            document.getElementById('home').setAttribute('href', base);
        })();
    </script>
</body>

</html>
